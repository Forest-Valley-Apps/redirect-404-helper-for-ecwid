name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3', '8.4', '8.5' ]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPCS
        run: composer phpcs

      - name: PHPUnit
        run: composer phpunit

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported stack: the plugin's PHP + WordPress floors
          # (Requires PHP 7.4 / Requires at least 6.0) on MySQL 8.0.
          - php: '7.4'
            mysql: '8.0'
            wp: '6.0'
          # Newest stack.
          - php: '8.5'
            mysql: '8.4'
            wp: 'latest'
    name: Integration (PHP ${{ matrix.php }} + MySQL ${{ matrix.mysql }} + WP ${{ matrix.wp }})
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli
          coverage: none

      - name: Install Subversion (WordPress test library is fetched via svn)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install WordPress test suite + test database
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: PHPUnit (integration — schema migration against real WP + MySQL)
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer phpunit:integration
